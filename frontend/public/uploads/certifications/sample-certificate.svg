  <rect x="28" y="28" width="744" height="544" rx="16" fill="#fdfbff" stroke="#7540c0" stroke-width="3"/>
  <rect x="46" y="46" width="708" height="508" rx="8" fill="none" stroke="#ddccf5" stroke-width="2"/>
