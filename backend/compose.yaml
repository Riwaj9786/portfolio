version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend:1.0
    container_name: backend_server
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - backend_network


  postgres_db:
    image: postgres
    container_name: rioz_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PORT: ${DATABASE_PORT}
    ports:
      - 5432:5432
    networks:
      - backend_network
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    networks:
      - backend_network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: celery:latest
    container_name: celery
    command: celery -A backend.celery worker --loglevel=info
    restart: on-failure
    env_file:
      - .env
    depends_on:
      - redis
      - postgres_db
      - server
    networks:
      - backend_network


networks:
  backend_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

